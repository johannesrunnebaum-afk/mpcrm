// ─── HELPERS ──────────────────────────────────────────────────
function daysUntil(dateStr){
  const d=new Date(dateStr), now=new Date('2026-05-08');
  return Math.ceil((d-now)/(1000*60*60*24));
}
function formatDate(str){
  const d=new Date(str);
  return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function healthColor(h){
  if(h>=70) return C.green;
  if(h>=40) return C.orange;
  return C.red;
}
function healthBg(h){
  if(h>=70) return C.greenLight;
  if(h>=40) return C.orangeLight;
  return C.redLight;
}
function healthLabel(h){
  if(h>=70) return 'Gesund';
  if(h>=40) return 'Neutral';
  return 'Gefährdet';
}

// ─── AVATAR ───────────────────────────────────────────────────
function Avatar({initials,color,size=32}){
  return(
    <div style={{width:size,height:size,borderRadius:'50%',background:color,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:size*0.33,fontWeight:600,flexShrink:0}}>
      {initials.slice(0,2)}
    </div>
  );
}

// ─── STATUS BADGE ─────────────────────────────────────────────
function Badge({label,color,bg}){
  return(
    <span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'3px 10px',borderRadius:20,fontSize:12,fontWeight:600,color,background:bg}}>
      {label}
    </span>
  );
}

function StatusBadge({status}){
  if(status==='Aktiv') return <Badge label="Aktiv" color={C.green} bg={C.greenLight}/>;
  if(status==='Gefährdet') return <Badge label="Gefährdet" color={C.red} bg={C.redLight}/>;
  return <Badge label={status} color={C.text2} bg={C.bg}/>;
}

function PlanBadge({plan}){
  const map={Pro:[C.purple,C.purpleLight],Business:[C.blue,C.blueLight],Starter:[C.text2,'#F0F0F0']};
  const [c,bg]=map[plan]||[C.text2,'#F0F0F0'];
  return <Badge label={plan} color={c} bg={bg}/>;
}

// ─── HEALTH BAR ───────────────────────────────────────────────
function HealthBar({score,showLabel=false,width=100}){
  const col=healthColor(score);
  return(
    <div style={{display:'flex',alignItems:'center',gap:8}}>
      <div style={{width,height:6,borderRadius:3,background:C.border,overflow:'hidden'}}>
        <div style={{width:`${score}%`,height:'100%',background:col,borderRadius:3,transition:'width .3s'}}/>
      </div>
      <span style={{fontSize:12,fontWeight:600,color:col,minWidth:24}}>{score}</span>
      {showLabel&&<span style={{fontSize:11,color:col}}>{healthLabel(score)}</span>}
    </div>
  );
}

// ─── CARD ─────────────────────────────────────────────────────
function Card({children,style={},onClick}){
  return(
    <div onClick={onClick} style={{background:C.white,borderRadius:12,border:`1px solid ${C.border}`,padding:20,cursor:onClick?'pointer':undefined,...style}}>
      {children}
    </div>
  );
}

// ─── KPI CARD ─────────────────────────────────────────────────
function KpiCard({label,value,sub,icon,accent}){
  return(
    <Card style={{minWidth:0}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
        <span style={{fontSize:12,color:C.text2,fontWeight:500}}>{label}</span>
        {icon&&<div style={{width:32,height:32,borderRadius:8,background:accent||C.bg,display:'flex',alignItems:'center',justifyContent:'center',color:C.text2}}>{icon}</div>}
      </div>
      <div style={{fontSize:28,fontWeight:700,letterSpacing:'-1px',lineHeight:1}}>{value}</div>
      {sub&&<div style={{fontSize:12,color:C.text2,marginTop:6}}>{sub}</div>}
    </Card>
  );
}

// ─── TOP BAR ──────────────────────────────────────────────────
function TopBar({title,onBack,backLabel}){
  return(
    <div style={{height:56,background:C.white,borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 28px',flexShrink:0}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        {onBack&&(
          <button onClick={onBack} style={{display:'flex',alignItems:'center',gap:6,color:C.text2,fontWeight:500,fontSize:13,padding:'6px 10px',borderRadius:7,background:'transparent'}} onMouseEnter={e=>e.target.style.background=C.bg} onMouseLeave={e=>e.target.style.background='transparent'}>
            <Icon.arrowLeft/>{backLabel||'Zurück'}
          </button>
        )}
        <h1 style={{fontSize:15,fontWeight:700}}>{title}</h1>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:12}}>
        <div style={{display:'flex',alignItems:'center',gap:8,background:C.bg,borderRadius:8,padding:'7px 13px',width:220}}>
          <Icon.search/>
          <input placeholder="Suchen..." style={{border:'none',background:'transparent',outline:'none',width:'100%',color:C.text,fontSize:13}} />
        </div>
        <div style={{position:'relative'}}>
          <button style={{display:'flex',alignItems:'center',padding:8,borderRadius:8,color:C.text2}} onMouseEnter={e=>e.currentTarget.style.background=C.bg} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
            <Icon.bell/>
          </button>
          <span style={{position:'absolute',top:4,right:4,width:9,height:9,borderRadius:'50%',background:C.red,border:`2px solid ${C.white}`}}/>
        </div>
        <div style={{width:34,height:34,borderRadius:'50%',background:'#F59E0B',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:13,cursor:'pointer'}}>JR</div>
      </div>
    </div>
  );
}

// ─── DASHBOARD ────────────────────────────────────────────────
function Dashboard({setView,setSelectedId}){
  const totalMrr=CUSTOMERS.reduce((s,c)=>s+c.mrr,0);
  const aktive=CUSTOMERS.filter(c=>c.status==='Aktiv').length;
  const gefaehrdet=CUSTOMERS.filter(c=>c.status==='Gefährdet').length;
  const avgHealth=Math.round(CUSTOMERS.reduce((s,c)=>s+c.health,0)/CUSTOMERS.length);
  const renewalSoon=CUSTOMERS.filter(c=>daysUntil(c.renewal)<=60).length;

  const today=new Date('2026-05-08');
  const dayName=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'][today.getDay()];
  const dayStr=today.toLocaleDateString('de-DE',{day:'numeric',month:'long'});

  return(
    <div style={{padding:28,overflow:'auto',flex:1}}>
      <div style={{fontSize:24,fontWeight:700,marginBottom:24,letterSpacing:'-0.5px'}}>Guten Morgen! 👋</div>

      {/* Date + MRR row */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:16,marginBottom:16}}>
        <Card>
          <div style={{fontSize:12,color:C.purple,fontWeight:600,marginBottom:4}}>{dayName}</div>
          <div style={{fontSize:24,fontWeight:700,letterSpacing:'-0.5px'}}>{dayStr}</div>
          <div style={{marginTop:12}}>
            <div style={{fontSize:11,color:C.text2,fontWeight:500,marginBottom:6}}>HEUTE FÄLLIG</div>
            {CUSTOMERS.filter(c=>{const d=daysUntil(c.renewal);return d<=0}).length===0?(
              <div style={{fontSize:12,color:C.text3,fontStyle:'italic'}}>Keine Renewals heute</div>
            ):(
              CUSTOMERS.filter(c=>daysUntil(c.renewal)===0).map(c=>(
                <div key={c.id} style={{fontSize:12,color:C.text,fontWeight:500,background:C.redLight,padding:'4px 10px',borderRadius:6,display:'inline-block'}}>{c.name}</div>
              ))
            )}
          </div>
        </Card>
        <KpiCard label="Gesamt MRR" value={`${totalMrr.toLocaleString('de-DE')} €`} sub={`${CUSTOMERS.length} aktive Verträge`} icon={<Icon.trends/>} accent="#FEF9C3"/>
        <KpiCard label="Ø Health Score" value={avgHealth} sub={`${gefaehrdet} Kunden gefährdet`} icon={<Icon.health/>} accent={avgHealth>=70?C.greenLight:C.orangeLight}/>
        <KpiCard label="Renewals (60 Tage)" value={renewalSoon} sub="Erfordern Aufmerksamkeit" icon={<Icon.renewals/>} accent={renewalSoon>2?C.redLight:C.orangeLight}/>
      </div>

      {/* Second row */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:16,marginBottom:16}}>
        <KpiCard label="Aktive Kunden" value={aktive} sub={`von ${CUSTOMERS.length} gesamt`} icon={<Icon.kunden/>} accent={C.greenLight}/>
        <KpiCard label="Gefährdete Kunden" value={gefaehrdet} sub="Health Score < 50" icon={<Icon.warning/>} accent={C.redLight}/>
        <KpiCard label="Ø NPS Score" value={(CUSTOMERS.reduce((s,c)=>s+c.nps,0)/CUSTOMERS.length).toFixed(1)} sub="Net Promoter Score" icon={<Icon.health/>} accent={C.blueLight}/>
      </div>

      {/* Health + Activities */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        {/* Health overview */}
        <Card>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
            <span style={{fontWeight:700,fontSize:14}}>Health Score Übersicht</span>
            <button onClick={()=>setView('health')} style={{fontSize:12,color:C.purple,fontWeight:600,padding:'4px 10px',borderRadius:6,background:C.purpleLight}}>Alle ansehen</button>
          </div>
          {[...CUSTOMERS].sort((a,b)=>a.health-b.health).map(c=>(
            <div key={c.id} onClick={()=>{setSelectedId(c.id);setView('kunden-detail');}} style={{display:'flex',alignItems:'center',gap:12,padding:'8px 0',borderBottom:`1px solid ${C.border}`,cursor:'pointer'}} onMouseEnter={e=>e.currentTarget.style.background='#FAFAFA'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <Avatar initials={c.initials} color={c.color} size={28}/>
              <span style={{fontSize:13,fontWeight:500,flex:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{c.name}</span>
              <HealthBar score={c.health} width={80}/>
            </div>
          ))}
        </Card>
        {/* Recent Activities */}
        <Card>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
            <span style={{fontWeight:700,fontSize:14}}>Letzte Aktivitäten</span>
            <button onClick={()=>setView('kommunikation')} style={{fontSize:12,color:C.purple,fontWeight:600,padding:'4px 10px',borderRadius:6,background:C.purpleLight}}>Alle ansehen</button>
          </div>
          {ACTIVITIES.map(a=>{
            const cust=CUSTOMERS.find(c=>c.id===a.customerId);
            const typeColor={email:C.blue,call:C.green,note:C.orange,system:C.text2}[a.type];
            const typeIcon={email:<Icon.email/>,call:<Icon.phone/>,note:<Icon.note/>,system:<Icon.trends/>}[a.type];
            return(
              <div key={a.id} style={{display:'flex',gap:10,padding:'10px 0',borderBottom:`1px solid ${C.border}`}}>
                <Avatar initials={a.initials} color={a.color} size={30}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:500,lineHeight:1.4,color:C.text}}>{a.text}</div>
                  <div style={{display:'flex',gap:8,marginTop:4,alignItems:'center'}}>
                    <span style={{fontSize:11,color:typeColor,display:'flex',alignItems:'center',gap:3}}>{typeIcon}{a.type}</span>
                    <span style={{fontSize:11,color:C.text3}}>·</span>
                    <span style={{fontSize:11,color:C.text2,fontWeight:500}}>{cust?.name}</span>
                    <span style={{fontSize:11,color:C.text3}}>· {a.date.split('-').reverse().join('.')}</span>
                  </div>
                </div>
              </div>
            );
          })}
        </Card>
      </div>
    </div>
  );
}

// ─── KUNDEN LIST ──────────────────────────────────────────────
function KundenList({setView,setSelectedId}){
  const [search,setSearch]=useState('');
  const [filter,setFilter]=useState('Alle');
  const filtered=CUSTOMERS.filter(c=>{
    const matchSearch=c.name.toLowerCase().includes(search.toLowerCase())||c.industry.toLowerCase().includes(search.toLowerCase());
    const matchFilter=filter==='Alle'||c.status===filter;
    return matchSearch&&matchFilter;
  });
  return(
    <div style={{padding:28,overflow:'auto',flex:1}}>

          <h2 style={{fontWeight:700,fontSize:18,letterSpacing:'-0.3px'}}>Kunden</h2>
          <p style={{color:C.text2,fontSize:13,marginTop:2}}>{CUSTOMERS.length} Kunden insgesamt · {CUSTOMERS.reduce((s,c)=>s+c.mrr,0).toLocaleString('de-DE')} € MRR</p>

        <button style={{display:'flex',alignItems:'center',gap:7,padding:'9px 16px',background:'#1A1A1A',color:'#fff',borderRadius:8,fontWeight:600,fontSize:13}}>

        {['Alle','Aktiv','Gefährdet'].map(f=>(
          <button key={f} onClick={()=>setFilter(f)} style={{padding:'7px 14px',borderRadius:8,border:`1px solid ${filter===f?'#1A1A1A':C.border}`,background:filter===f?'#1A1A1A':C.white,color:filter===f?'#fff':C.text,fontWeight:filter===f?600:400,fontSize:13}}>

                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <Avatar initials={c.initials} color={c.color} size={32}/>
                    <div>
                      <div style={{fontWeight:600,fontSize:13}}>{c.name}</div>

                <td style={{padding:'12px 16px'}}><PlanBadge plan={c.plan}/></td>

                <td style={{padding:'12px 16px'}}><HealthBar score={c.health} width={80}/></td>
                <td style={{padding:'12px 16px'}}><StatusBadge status={c.status}/></td>

                <td style={{padding:'12px 16px'}}>
                  <div style={{fontSize:12}}>
                    <div style={{fontWeight:500}}>{formatDate(c.renewal)}</div>

                </td>
                <td style={{padding:'12px 16px'}}>

  );
}

// ─── KUNDE DETAIL ─────────────────────────────────────────────

  const contacts=CONTACTS.filter(x=>x.customerId===id);
  const activities=ACTIVITIES.filter(x=>x.customerId===id);
  const onboarding=ONBOARDING_DATA.find(x=>x.customerId===id);
  const daysLeft=daysUntil(c.renewal);

  const tabs=[{id:'overview',label:'Übersicht'},{id:'contacts',label:`Kontakte (${contacts.length})`},{id:'activities',label:'Aktivitäten'},{id:'onboarding',label:'Onboarding'}];

  return(

            <PlanBadge plan={c.plan}/>

          <button style={{padding:'8px 16px',border:`1px solid ${C.border}`,borderRadius:8,fontWeight:500,fontSize:13,background:C.white}}>Notiz hinzufügen</button>
          <button style={{padding:'8px 16px',background:'#1A1A1A',color:'#fff',borderRadius:8,fontWeight:600,fontSize:13}}>Aktivität loggen</button>

      </div>

          <div style={{fontSize:11,color:C.text2,fontWeight:500,marginBottom:6}}>HEALTH SCORE</div>

        </Card>
        <Card style={{padding:'14px 16px'}}>
          <div style={{fontSize:11,color:C.text2,fontWeight:500,marginBottom:6}}>RENEWAL</div>
          <div style={{fontSize:15,fontWeight:700}}>{formatDate(c.renewal)}</div>
          <div style={{fontSize:11,color:daysLeft<=60?C.red:daysLeft<=90?C.orange:C.green}}>{daysLeft} Tage</div>
        </Card>
        <Card style={{padding:'14px 16px'}}>
          <div style={{fontSize:11,color:C.text2,fontWeight:500,marginBottom:6}}>LETZTER LOGIN</div>
          <div style={{fontSize:15,fontWeight:700}}>{formatDate(c.lastLogin)}</div>

// ─── BERICHTE ─────────────────────────────────────────────────
function BerichteView(){
  const totalMrr=CUSTOMERS.reduce((s,c)=>s+c.mrr,0);
  const avgHealth=Math.round(CUSTOMERS.reduce((s,c)=>s+c.health,0)/CUSTOMERS.length);
  const churnRisk=CUSTOMERS.filter(c=>c.status==='Gefährdet').length;
  const churnRate=Math.round((churnRisk/CUSTOMERS.length)*100);

  // Plan distribution
  const planDist={Pro:0,Business:0,Starter:0};
  CUSTOMERS.forEach(c=>planDist[c.plan]++);

  // MRR by plan
  const mrrByPlan={Pro:0,Business:0,Starter:0};
  CUSTOMERS.forEach(c=>mrrByPlan[c.plan]+=c.mrr);

  // Fake monthly MRR data
  const months=['Jan','Feb','Mär','Apr','Mai'];
  const mrrData=[2200,2499,2599,2794,2893];
  const maxMrr=Math.max(...mrrData);

  const healthDist=[
    {label:'Gesund (70–100)',count:CUSTOMERS.filter(c=>c.health>=70).length,color:C.green},
    {label:'Neutral (40–69)',count:CUSTOMERS.filter(c=>c.health>=40&&c.health<70).length,color:C.orange},
    {label:'Gefährdet (0–39)',count:CUSTOMERS.filter(c=>c.health<40).length,color:C.red},
  ];

  return(
    <div style={{padding:28,overflow:'auto',flex:1}}>
      <div style={{marginBottom:20}}>
        <h2 style={{fontWeight:700,fontSize:18,letterSpacing:'-0.3px'}}>Berichte & Analytics</h2>
        <p style={{color:C.text2,fontSize:13,marginTop:2}}>Übersicht über dein Customer-Portfolio</p>
      </div>

      {/* Top KPIs */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:16,marginBottom:20}}>
        <KpiCard label="Gesamt MRR" value={`${totalMrr.toLocaleString('de-DE')} €`} sub="+3.6% zum Vormonat"/>
        <KpiCard label="ARR (Jahresumsatz)" value={`${(totalMrr*12).toLocaleString('de-DE')} €`} sub="Hochgerechnet"/>
        <KpiCard label="Ø Health Score" value={avgHealth} sub={`${CUSTOMERS.length} Kunden`}/>
        <KpiCard label="Churn-Risiko" value={`${churnRate}%`} sub={`${churnRisk} von ${CUSTOMERS.length} Kunden`}/>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
        {/* MRR Chart */}
        <Card>
          <div style={{fontWeight:700,fontSize:14,marginBottom:16}}>MRR Entwicklung</div>
          <svg width="100%" height="160" viewBox="0 0 400 160">
            {/* Grid lines */}
            {[0,.25,.5,.75,1].map((t,i)=>(
              <line key={i} x1="40" y1={140-t*120} x2="400" y2={140-t*120} stroke={C.border} strokeWidth="1"/>
            ))}
            {/* Area */}
            <defs>
              <linearGradient id="mrrGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor={C.lime} stopOpacity=".4"/>
                <stop offset="100%" stopColor={C.lime} stopOpacity="0"/>
              </linearGradient>
            </defs>
            <path d={`M${mrrData.map((v,i)=>`${40+i*80},${140-(v/maxMrr)*120}`).join(' L')} L${40+(mrrData.length-1)*80},140 L40,140 Z`} fill="url(#mrrGrad)"/>
            <polyline points={mrrData.map((v,i)=>`${40+i*80},${140-(v/maxMrr)*120}`).join(' ')} fill="none" stroke="#1A1A1A" strokeWidth="2.5" strokeLinejoin="round"/>
            {mrrData.map((v,i)=>(
              <circle key={i} cx={40+i*80} cy={140-(v/maxMrr)*120} r="4" fill="#1A1A1A"/>
            ))}
            {months.map((m,i)=>(
              <text key={i} x={40+i*80} y="158" textAnchor="middle" fontSize="11" fill={C.text2}>{m}</text>
            ))}
            {mrrData.map((v,i)=>(
              <text key={i} x={40+i*80} y={130-(v/maxMrr)*120} textAnchor="middle" fontSize="10" fill={C.text} fontWeight="600">{v}€</text>
            ))}
          </svg>
        </Card>

        {/* Health Distribution */}
        <Card>
          <div style={{fontWeight:700,fontSize:14,marginBottom:16}}>Health Score Verteilung</div>
          {healthDist.map(h=>(
            <div key={h.label} style={{marginBottom:14}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:5,fontSize:12}}>
                <span style={{color:C.text2}}>{h.label}</span>
                <span style={{fontWeight:700,color:h.color}}>{h.count} Kunden</span>
              </div>
              <div style={{width:'100%',height:8,background:C.bg,borderRadius:4,overflow:'hidden'}}>
                <div style={{width:`${(h.count/CUSTOMERS.length)*100}%`,height:'100%',background:h.color,borderRadius:4}}/>
              </div>
            </div>
          ))}
          {/* Simple circles */}
          <div style={{display:'flex',gap:12,marginTop:16}}>
            {healthDist.map(h=>(
              <div key={h.label} style={{flex:1,textAlign:'center',background:h.color+'18',borderRadius:10,padding:'12px 8px'}}>
                <div style={{fontSize:24,fontWeight:700,color:h.color}}>{h.count}</div>
                <div style={{fontSize:10,color:h.color,fontWeight:600,marginTop:2}}>{h.label.split(' ')[0]}</div>
              </div>
            ))}
          </div>
        </Card>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        {/* Plan Distribution */}
        <Card>
          <div style={{fontWeight:700,fontSize:14,marginBottom:16}}>Plan-Verteilung & MRR</div>
          {Object.entries(planDist).map(([plan,count])=>{
            const planColors={Pro:C.purple,Business:C.blue,Starter:C.text2};
            const planBg={Pro:C.purpleLight,Business:C.blueLight,Starter:'#F0F0F0'};
            return(
              <div key={plan} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 0',borderBottom:`1px solid ${C.border}`}}>
                <div style={{width:36,height:36,borderRadius:8,background:planBg[plan],display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <span style={{fontSize:11,fontWeight:700,color:planColors[plan]}}>{plan[0]}</span>
                </div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:600,fontSize:13}}>{plan}</div>
                  <div style={{fontSize:11,color:C.text2}}>{count} Kunden · {mrrByPlan[plan]} €/mo</div>
                </div>
                <div style={{width:80,height:6,background:C.bg,borderRadius:3,overflow:'hidden'}}>
                  <div style={{width:`${(count/CUSTOMERS.length)*100}%`,height:'100%',background:planColors[plan],borderRadius:3}}/>
                </div>
                <span style={{fontWeight:700,fontSize:13,minWidth:32,textAlign:'right'}}>{count}</span>
              </div>
            );
          })}
        </Card>
        {/* Top & Bottom Performers */}
        <Card>
          <div style={{fontWeight:700,fontSize:14,marginBottom:16}}>Top & Risiko Kunden</div>
          <div style={{fontSize:11,fontWeight:700,color:C.green,marginBottom:8,letterSpacing:'0.5px'}}>TOP PERFORMER</div>
          {[...CUSTOMERS].sort((a,b)=>b.health-a.health).slice(0,3).map(c=>(
            <div key={c.id} style={{display:'flex',alignItems:'center',gap:10,padding:'7px 0'}}>
              <Avatar initials={c.initials} color={c.color} size={28}/>
              <span style={{flex:1,fontSize:12,fontWeight:500}}>{c.name}</span>
              <span style={{fontSize:12,fontWeight:700,color:C.green}}>{c.health}</span>
            </div>
          ))}
          <div style={{height:1,background:C.border,margin:'10px 0'}}/>
          <div style={{fontSize:11,fontWeight:700,color:C.red,marginBottom:8,letterSpacing:'0.5px'}}>CHURN RISIKO</div>
          {[...CUSTOMERS].sort((a,b)=>a.health-b.health).slice(0,3).map(c=>(
            <div key={c.id} style={{display:'flex',alignItems:'center',gap:10,padding:'7px 0'}}>
              <Avatar initials={c.initials} color={c.color} size={28}/>
              <span style={{flex:1,fontSize:12,fontWeight:500}}>{c.name}</span>
              <span style={{fontSize:12,fontWeight:700,color:C.red}}>{c.health}</span>
            </div>
          ))}
        </Card>
      </div>
    </div>
  );
}

// ─── APP ROOT ─────────────────────────────────────────────────
function App(){
  const [view,setView]=useState('dashboard');
  const [selectedId,setSelectedId]=useState(null);

  const viewTitles={
    dashboard:'Dashboard',kunden:'Kunden',kontakte:'Kontakte',
    'kunden-detail':CUSTOMERS.find(c=>c.id===selectedId)?.name||'Kunde',
    health:'Health Scores',onboarding:'Onboarding',renewals:'Renewals',
    kommunikation:'Kommunikation',berichte:'Berichte',
    einstellungen:'Einstellungen',hilfe:'Hilfe & Support',
  };

  return(
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <Sidebar view={view} setView={v=>{setView(v);}}/>
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <TopBar
          title={viewTitles[view]||view}
          onBack={view==='kunden-detail'?()=>setView('kunden'):undefined}
          backLabel="Kunden"
        />
        <div style={{flex:1,overflow:'auto',background:C.bg}}>
          {view==='dashboard'&&<Dashboard setView={setView} setSelectedId={setSelectedId}/>}
          {view==='kunden'&&<KundenList setView={setView} setSelectedId={setSelectedId}/>}
          {view==='kunden-detail'&&<KundeDetail id={selectedId} setView={setView}/>}
          {view==='kontakte'&&<KontakteView setView={setView} setSelectedId={setSelectedId}/>}
          {view==='health'&&<HealthView setView={setView} setSelectedId={setSelectedId}/>}
          {view==='onboarding'&&<OnboardingView setView={setView} setSelectedId={setSelectedId}/>}
          {view==='renewals'&&<RenewalsView setView={setView} setSelectedId={setSelectedId}/>}
          {view==='kommunikation'&&<KommunikationView setView={setView} setSelectedId={setSelectedId}/>}
          {view==='berichte'&&<BerichteView/>}
          {(view==='einstellungen'||view==='hilfe')&&(
            <div style={{padding:28}}>
              <div style={{padding:48,textAlign:'center',color:C.text3,fontSize:14}}>
                Dieser Bereich wird demnächst verfügbar sein.
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
